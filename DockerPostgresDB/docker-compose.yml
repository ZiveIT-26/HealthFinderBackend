version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: healthfinder_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: healthfinder
    ports:
      - "65432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./csv:/csv
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
