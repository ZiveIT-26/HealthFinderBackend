# Speciality -> query for the find_medical_facility tool (official KSK register,
# geoportalksk.sk). planSearch uses this table to call the tool with a query that
# really matches, instead of the model guessing a word ("zubná" finds 3 of 132
# dentists in Košice I, "ambulancia zubného lekárstva" finds all of them).
#
# Speciality names are the same Slovak names as on zoznam-lekarov.sk.
#   query:         passed to the tool as is (it is the register's facility type)
#   nameIncludes:  optional; keep only facilities whose name contains this text
#                  (one type is shared by adults and children)
# Specialities that are not in this table are searched only with find_doctors.

facilityTypes:
  Všeobecný lekár:
    - query: ambulancia všeobecnej ambulantnej zdravotnej starostlivosti
      nameIncludes: pre dospelých
  "Detský lekár (pediater)":
    - query: ambulancia všeobecnej ambulantnej zdravotnej starostlivosti
      nameIncludes: pre deti a dorast
    - query: pediatrická ambulancia len v nemocnici, v ktorej sa poskytuje ústavná zdravotná starostlivosť najmenej v jednom pediatrickom odbore
  "Zubár (stomatológ)":
    - query: ambulancia zubného lekárstva
  Gynekológ:
    - query: gynekologicko-pôrodnícka ambulancia
  Internista:
    - query: ambulancia vnútorného lekárstva
  Psychológ:
    - query: ambulancia klinickej psychológie
  "Očný lekár (oftalmológ)":
    - query: oftalmologická ambulancia
  Fyziatria:
    - query: ambulancia fyziatrie, balneológie a liečebnej rehabilitácie
  Chirurg:
    - query: chirurgická ambulancia
  Ortopéd:
    - query: ortopedická ambulancia
  Neurológ:
    - query: neurologická ambulancia
  "Kožný lekár (dermatológ)":
