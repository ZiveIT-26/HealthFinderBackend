# SYSTEM MESSAGES
# Everything the USER sees that DOES NOT come from the model:
#  - fallback answers
#  - errors
#  - fixed parts of lists


# Fixed texts for when the model cannot answer (Ollama down, error, ...).
fallbackMessages:
  emergency: |
    Môže ísť o naliehavý stav. Volajte záchranku: 112 alebo 155.
    This may be a medical emergency. Call an ambulance now: 112 or 155.
  answerFailed: |
    Odpoveď sa nepodarilo pripraviť, skúste to prosím znova.
    The assistant could not complete this response. Please try again.
  doctorsFound: "Lekári / doctors: {count}"

# Errors returned by the API (POST /chat, GET /chat/stream/:id).
errors:
  messageRequired: "Message is required"
  streamNotFound: "Stream session not found or expired. Create a new message and use its returned streamId."
  streamFailed: "The stream could not be completed. Please try again."

# Fixed parts of each doctor in the list.
doctorList:
  addressMissing: "Not available"
  otherSpecialities: "Also: {specialities}"
