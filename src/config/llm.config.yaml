# List here the domains llm allowed to talk to

allowedApiDomains:
  - www.zoznam-lekarov.sk
  - www.geoportalksk.sk

trustedDoctorSources:
  - domain: www.zoznam-lekarov.sk
    description: Slovak directory of doctors and healthcare providers.
    apiInstructions: |
      This is a plain HTML website. Pages are organised like this:
        1. https://www.zoznam-lekarov.sk/ lists all specialities as links.
        2. A speciality page lists regions (kraj), e.g. "Košický kraj".
        3. A region page lists towns, e.g. "Košice I".
        4. A town page lists the doctors (name, address, link to detail page).
      Start with the homepage, follow the link of the requested speciality,
      then "Košický kraj", then the user's town. If the user gave no town,
      use "Košice I". Links are shown as [text](/path): pass that /path to
      fetch_trusted_doctor_page. Only follow links that appear in fetched pages.
      Use each doctor's detail-page link as the doctor's source URL.
